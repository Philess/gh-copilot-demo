name: Build and Push Album API to Docker Hub

on:
  push:
    branches:
      - main
    paths:
      - 'albums-api/**'
      - '.github/workflows/workflow.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Replace version in appmanifest.yml files
        run: |
          find . -name "appmanifest.yml" -type f -exec sed -i "s/%%VERSION%%/${{ github.run_id }}/g" {} +
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./albums-api
          file: ./albums-api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/album-api:latest
            ${{ secrets.DOCKER_USERNAME }}/album-api:${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
