# GitHub Action workflow that runs on push to main branch
# Docker build and push the album-api image to ACR

name: Build and Push Docker Image
on:
  push:
    branches:
      - main
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/album-api:${{ github.sha }} .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/album-api:${{ github.sha }}
          


# run tests on the album-api image

# run tests on the album-api image
      - name: Run tests
        run: |
          docker run --rm ${{ secrets.ACR_LOGIN_SERVER }}/album-api:${{ github.sha }} pytest


# deploy the album-api image to the dev AKS cluster
# find and replace the %%VERSION%% by the GitHub action run id in every appmanifest.yml file
      - name: Deploy to AKS
        run: |
          sed -i "s/%%VERSION%%/${{ github.run_id }}/g" k8s/appmanifest.yml
          kubectl apply -f k8s/appmanifest.yml
