name: Build and push album API

on:
  push:
    branches:
      - main
    paths:
      - "albums-api/**"
      - ".github/workflows/workflow.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: album-api-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
  IMAGE_NAME: album-api

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./albums-api
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

 # tag the image with the GitHub run id and push to docker hub
      - name: Tag and push image with GitHub run id
        uses: docker/build-push-action@v6
        with:
          context: ./albums-api
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.run_id }}
          labels: ${{ steps.metadata.outputs.labels }}

# run tests on the album-api image
      - name: Run tests
        uses: docker://alpine:latest
        with:
          entrypoint: sh
          args: -c "echo Running tests on ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.run_id }} && exit 0"

# deploy the album-api image to the dev AKS cluster
      - name: Deploy to dev AKS cluster
        uses: azure/aks-set-context@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}

      - name: Update album-api deployment
        uses: azure/k8s-deploy@v4
        with:
          namespace: default
          manifests: ./albums-api/k8s/deployment.yaml
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.run_id }}

# find and replace the %%VERSION%% by the GitHub action run id in every appmanifest.yml file
      - name: Update appmanifest.yml with GitHub run id
        run: |
          find . -name "appmanifest.yml" -exec sed -i "s/%%VERSION%%/${{ github.run_id }}/g" {} \;      
          
