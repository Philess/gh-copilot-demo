# GitHub Action workflow that runs on push to main branch
# Docker build and push the album-api image to ACR
name: Build and Push Album API Image 
on:
  push:
    branches: [ main ]
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/album-api:latest -f ./albums-api/Dockerfile .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/album-api:latest
          # tag the image with the GitHub run id and push to docker hub
          docker tag ${{ secrets.ACR_LOGIN_SERVER }}/album-api:latest ${{ secrets.DOCKERHUB_USERNAME }}/album-api:${{ github.run_id }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/album-api:${{ github.run_id }}
          # tag the image with the GitHub run id and push to ACR
          docker tag ${{ secrets.ACR_LOGIN_SERVER }}/album-api:latest ${{ secrets.ACR_LOGIN_SERVER }}/album-api:${{ github.run_id }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/album-api:${{ github.run_id }}
          # run tests on the album-api image
          docker run --rm ${{ secrets.ACR_LOGIN_SERVER }}/album-api:latest dotnet test /app/Tests/AlbumApi.Tests.dll --logger "trx;LogFileName=test_results.trx"
          # upload test results to GitHub Actions
          mkdir -p $GITHUB_WORKSPACE/test-results
          mv test_results.trx $GITHUB_WORKSPACE/test-results/
      - name: Upload test results
        uses: actions/upload-artifact@v2
        with:
          name: test-results
          path: $GITHUB_WORKSPACE/test-results/
      # deploy the album-api image to the dev AKS cluster using kubectl
      - name: Deploy to AKS
        uses: azure/aks-set-context@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
      - name: Update album-api deployment image
        run: |
          kubectl set image deployment/album-api album-api=${{ secrets.ACR_LOGIN_SERVER }}/album-api:latest -n album-api
          kubectl rollout status deployment/album-api -n album-api
          # find and replace the %%VERSION%% by the GitHub action run id in every appmanifest.yml file
          find . -name "appmanifest.yml" -exec sed -i "s/%%VERSION%%/${{ github.run_id }}/g" {} \;
          # commit the changes to the appmanifest.yml files and push to the main branch
          git config --global user.name "GitHub Actions"
          git config --global user.email 
          git add .
          git commit -m "Update appmanifest.yml files with version ${{ github.run_id }}"
          git push origin main
          

